# application-prod.properties
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

spring.jpa.show-sql=false

# Never expose stack traces or detailed errors in production
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.com.hrms=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.security=WARN

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# JWT_SECRET, DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD are REQUIRED env vars in production
server.port=${SERVER_PORT:8080}
