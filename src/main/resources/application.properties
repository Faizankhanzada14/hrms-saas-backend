spring.application.name=hrms-backend

# Active profile is selected via SPRING_PROFILES_ACTIVE env var (dev|staging|prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart (for medical claim / profile picture uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT (overridden per environment; secret MUST be supplied via env var in staging/prod)
hrms.jwt.secret=${JWT_SECRET:yUTdGvmhjTloqg1rI2kIv51TFHmY3Y6l7KQKB5trf0uQLhNZa2PNZF7Da2Jp2NoLvdUE4P+sA4MC3fuuW4TnLA==}
hrms.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
hrms.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
hrms.jwt.issuer=hrms-backend
hrms.jwt.max-failed-attempts=${JWT_MAX_FAILED_ATTEMPTS:5}

# File storage (medical claim attachments)
hrms.file-storage.upload-dir=${UPLOAD_DIR:./uploads/medical-claims}
hrms.file-storage.max-file-size-bytes=${UPLOAD_MAX_BYTES:10485760}

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
