# application-staging.properties
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:hrms_staging}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5

spring.jpa.show-sql=false

logging.level.com.hrms=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# JWT secret MUST be supplied via the JWT_SECRET environment variable in this environment
server.port=${SERVER_PORT:8080}
